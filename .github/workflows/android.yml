
name: Gerar APK - Jogos da Fe

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extrair projeto
        run: |
          mkdir -p app_src
          unzip -q jogos-da-f-app-apk.zip -d app_src
          test -f app_src/package.json

      - name: Instalar dependencias
        run: |
          cd app_src
          npm install

      - name: Preparar Android
        run: |
          cd app_src
          npx cap add android
          npx cap sync android

      - name: Gerar APK
        run: |
          cd app_src/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Jogos-da-Fe-APK
          path: app_src/android/app/build/outputs/apk/debug/app-debug.apk
