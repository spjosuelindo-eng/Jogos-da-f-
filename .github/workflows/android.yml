
name: Gerar APK - Jogos da Fe

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Localizar e extrair ZIP
        run: |
          echo "Procurando arquivo ZIP..."
          find . -maxdepth 2 -type f -iname "*.zip"

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: Nenhum ZIP encontrado."
            exit 1
          fi

          echo "Arquivo encontrado: $ZIP_FILE"
          mkdir -p app_src
          unzip -q "$ZIP_FILE" -d app_src

          PACKAGE=$(find app_src -name package.json -not -path '*/node_modules/*' -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "ERRO: package.json não encontrado."
            find app_src -maxdepth 4 -type f
            exit 1
          fi

          APP_DIR=$(dirname "$PACKAGE")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Instalar dependências
        run: |
          cd "$APP_DIR"
          npm install

      - name: Preparar Android
        run: |
          cd "$APP_DIR"
          npx cap add android
          npx cap sync android

      - name: Gerar APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Jogos-da-Fe-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
